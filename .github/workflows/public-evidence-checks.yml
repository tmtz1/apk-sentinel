name: Public evidence checks
on:
  push:
  pull_request:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-public-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - name: Contract regression tests
        run: python -m unittest discover -s tests -v
      - name: Schema, copies, semantics and availability freshness
        run: python scripts/validate_public.py
      - name: Generated human pages match sources
        run: python scripts/render_docs.py --check
